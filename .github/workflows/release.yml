name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # for gh release create

jobs:
  build:
    name: build ${{ matrix.binary }} ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, binary: satellites,        validate: true  }
          - { goos: linux,  goarch: arm64, binary: satellites,        validate: false }
          - { goos: darwin, goarch: amd64, binary: satellites,        validate: false }
          - { goos: darwin, goarch: arm64, binary: satellites,        validate: false }
          - { goos: linux,  goarch: amd64, binary: satellites-server, validate: true  }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: build
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="${{ matrix.binary }}-${VERSION}-${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/bobmcallan/satellites/internal/verb.Version=${VERSION} \
              -X github.com/bobmcallan/satellites/internal/verb.Commit=${SHA} \
              -X github.com/bobmcallan/satellites/internal/verb.BuildTime=${DATE}" \
            -o "${OUT}" ./cmd/${{ matrix.binary }}
          sha256sum "${OUT}" > "${OUT}.sha256"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"

      - name: validate (linux/amd64 only)
        if: matrix.validate
        run: |
          ./"${OUT}" version
          ./"${OUT}" --help >/dev/null || true   # satellites-server has no --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: verify checksums
        run: |
          set -euo pipefail
          cd artifacts
          for sum in *.sha256; do
            sha256sum -c "${sum}"
          done

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
