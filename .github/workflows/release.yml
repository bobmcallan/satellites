name: release

# .version is canonical: every push to main reads it, and if the resulting
# tag v<version> does not already exist on the remote, this workflow
# creates it + builds + publishes the release. /commit-push bumps .version
# on every commit, so the operator's flow is: edit code, run /commit-push,
# done — the release falls out automatically.
on:
  push:
    branches: [main]

permissions:
  contents: write   # for tag push + gh release create

jobs:
  derive-tag:
    name: derive tag from .version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for tag listing
      - id: read
        run: |
          set -euo pipefail
          V="$(awk '/^version:/ {print $2}' .version)"
          if [ -z "$V" ]; then
            echo ".version missing or malformed" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          set -euo pipefail
          TAG="${{ steps.read.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — skipping release"
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag $TAG does not exist — release will run"
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.binary }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: derive-tag
    if: needs.derive-tag.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, binary: satellites,        validate: true  }
          - { goos: linux,  goarch: arm64, binary: satellites,        validate: false }
          - { goos: darwin, goarch: amd64, binary: satellites,        validate: false }
          - { goos: darwin, goarch: arm64, binary: satellites,        validate: false }
          - { goos: linux,  goarch: amd64, binary: satellites-server, validate: true  }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: build
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG:         ${{ needs.derive-tag.outputs.tag }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          BUILD="$(awk '/^build:/ {print $2}' .version)"
          OUT="${{ matrix.binary }}-${TAG}-${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/bobmcallan/satellites/internal/verb.Version=${TAG} \
              -X github.com/bobmcallan/satellites/internal/verb.Commit=${SHA} \
              -X github.com/bobmcallan/satellites/internal/verb.BuildTime=${BUILD}" \
            -o "${OUT}" ./cmd/${{ matrix.binary }}
          sha256sum "${OUT}" > "${OUT}.sha256"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"

      - name: validate (linux/amd64 only)
        if: matrix.validate
        run: |
          ./"${OUT}" version
          ./"${OUT}" --help >/dev/null || true   # satellites-server has no --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error

  release:
    name: tag + publish release
    needs: [derive-tag, build]
    if: needs.derive-tag.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: verify checksums
        run: |
          set -euo pipefail
          cd artifacts
          for sum in *.sha256; do
            sha256sum -c "${sum}"
          done

      - name: tag commit
        env:
          TAG: ${{ needs.derive-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.derive-tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
