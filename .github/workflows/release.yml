name: release

# .version is canonical: every push to main reads it. The release tag
# v<satellites.version> is the operator-facing canonical version (CLI is
# the surface operators interact with). Each binary is built with its
# own ldflag-injected version + build timestamp so satellites and
# satellites-server can rev independently — their asset filenames
# include their per-binary versions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # for tag push + gh release create

jobs:
  derive-tag:
    name: derive release tag from .version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      cli_version: ${{ steps.read.outputs.cli_version }}
      cli_build: ${{ steps.read.outputs.cli_build }}
      server_version: ${{ steps.read.outputs.server_version }}
      server_build: ${{ steps.read.outputs.server_build }}
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for tag listing
      - id: read
        run: |
          set -euo pipefail
          CLI_V=$(awk '$1=="satellites.version:" {print $2}' .version)
          CLI_B=$(awk '$1=="satellites.build:"   {print $2}' .version)
          SRV_V=$(awk '$1=="satellites-server.version:" {print $2}' .version)
          SRV_B=$(awk '$1=="satellites-server.build:"   {print $2}' .version)
          for v in "$CLI_V" "$CLI_B" "$SRV_V" "$SRV_B"; do
            if [ -z "$v" ]; then
              echo ".version missing or malformed (one of the per-binary fields is empty)" >&2
              exit 1
            fi
          done
          echo "cli_version=$CLI_V"    >> "$GITHUB_OUTPUT"
          echo "cli_build=$CLI_B"      >> "$GITHUB_OUTPUT"
          echo "server_version=$SRV_V" >> "$GITHUB_OUTPUT"
          echo "server_build=$SRV_B"   >> "$GITHUB_OUTPUT"
          echo "tag=v$CLI_V"           >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          set -euo pipefail
          TAG="${{ steps.read.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — skipping release"
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag $TAG does not exist — release will run"
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.binary }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: derive-tag
    if: needs.derive-tag.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, binary: satellites,        validate: true  }
          - { goos: linux,  goarch: arm64, binary: satellites,        validate: false }
          - { goos: darwin, goarch: amd64, binary: satellites,        validate: false }
          - { goos: darwin, goarch: arm64, binary: satellites,        validate: false }
          - { goos: linux,  goarch: amd64, binary: satellites-server, validate: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: build
        env:
          GOOS:           ${{ matrix.goos }}
          GOARCH:         ${{ matrix.goarch }}
          CGO_ENABLED:    '0'
          BINARY:         ${{ matrix.binary }}
          CLI_VERSION:    ${{ needs.derive-tag.outputs.cli_version }}
          CLI_BUILD:      ${{ needs.derive-tag.outputs.cli_build }}
          SERVER_VERSION: ${{ needs.derive-tag.outputs.server_version }}
          SERVER_BUILD:   ${{ needs.derive-tag.outputs.server_build }}
        run: |
          set -euo pipefail
          if [ "$BINARY" = "satellites" ]; then
            BIN_VER="$CLI_VERSION"
            BIN_BUILD="$CLI_BUILD"
          else
            BIN_VER="$SERVER_VERSION"
            BIN_BUILD="$SERVER_BUILD"
          fi
          OUT="${BINARY}-v${BIN_VER}-${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/bobmcallan/satellites/internal/verb.Version=v${BIN_VER} \
              -X github.com/bobmcallan/satellites/internal/verb.Commit=${GITHUB_SHA} \
              -X github.com/bobmcallan/satellites/internal/verb.BuildTime=${BIN_BUILD}" \
            -o "${OUT}" ./cmd/${BINARY}
          sha256sum "${OUT}" > "${OUT}.sha256"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"

      - name: validate (linux/amd64 satellites only)
        if: matrix.validate
        run: |
          ./"${OUT}" version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error

  release:
    name: tag + publish release
    needs: [derive-tag, build]
    if: needs.derive-tag.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: verify checksums
        run: |
          set -euo pipefail
          cd artifacts
          for sum in *.sha256; do
            sha256sum -c "${sum}"
          done

      - name: tag commit
        env:
          TAG: ${{ needs.derive-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: gh release create
        env:
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TAG:            ${{ needs.derive-tag.outputs.tag }}
          CLI_VERSION:    ${{ needs.derive-tag.outputs.cli_version }}
          SERVER_VERSION: ${{ needs.derive-tag.outputs.server_version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "satellites v${CLI_VERSION} · satellites-server v${SERVER_VERSION}

          See per-binary versions in asset filenames." \
            artifacts/*
