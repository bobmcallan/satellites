name: test

# CI gates on BOTH the fast UNIT path (`vet-test`) AND the INTEGRATION tier
# (`integration` — testcontainers Postgres + chromedp against headless Chrome).
# release.yml and deploy.yml gate on THIS workflow via `workflow_run` +
# `conclusion == 'success'`, so a red in EITHER job blocks the GitHub release
# and the Fly rollout. The integration tier was previously a LOCAL-only gate;
# a portal render regression (sty_1ec60215) reached production because nothing
# in CI ran it, so it is now a CI gate again (sty_353310ce, reversing
# sty_ae474ca3's local-only optimisation — the runner-minute cost buys the
# enforcement). Any test still flaky on a GH runner is quarantined with a NAMED
# skip referencing a follow-up, never a blanket disable.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: install graphviz
        # TestWorkflowDOT pipes the workflow DOT export through `dot` when the
        # binary exists — install it so the parse assertion runs in CI instead
        # of skipping (sty_60f1f5eb).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  integration:
    # testcontainers Postgres + chromedp portal renders — the tier that catches
    # render/page regressions the unit path can't (sty_353310ce). ubuntu-latest
    # ships Docker (testcontainers) and google-chrome-stable (chromedp).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: chrome version (chromedp target)
        run: google-chrome --version || google-chrome-stable --version
      - name: integration tier
        run: go test -tags integration ./tests/integration/...
