name: test

# CI runs the fast, deterministic UNIT path only — `vet-test` (go vet + go
# test ./...). release.yml and deploy.yml gate on THIS workflow via
# `workflow_run` + `conclusion == 'success'`, so a unit/vet red blocks the
# GitHub release and the Fly rollout.
#
# The INTEGRATION tier (go test -tags integration — testcontainers Postgres +
# chromedp against headless Chrome) is NOT run here. It is a LOCAL pre-push
# gate: the workflow's `techdebt-review` state runs `satellites techdebt
# review` (build + unit + integration) against the working tree before any
# commit/push, and a red there returns the story to in_progress with nothing
# shipped (sty_2ce777c4). Headless Chrome in a GH runner flakes on the
# websocket handshake (TestAdminPeoplePortal websocket-timeout) and costs
# runner minutes; locally chromedp is stable, so integration is enforced where
# it is reliable. This supersedes the CI deploy-path integration gate that
# sty_ae474ca3 added — integration is a gate again, just a local one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: install graphviz
        # TestWorkflowDOT pipes the workflow DOT export through `dot` when the
        # binary exists — install it so the parse assertion runs in CI instead
        # of skipping (sty_60f1f5eb).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
