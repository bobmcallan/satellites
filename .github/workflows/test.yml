name: test

# Two parallel gates, both required for this workflow to conclude `success`:
#   - vet-test:    fast unit path (go vet + go test ./...).
#   - integration: the integration tier (go test -tags integration), which
#                  testcontainers-spins a Postgres and drives chromedp against
#                  Google Chrome (both present on ubuntu-latest runners).
#
# release.yml and deploy.yml gate on THIS workflow via `workflow_run` +
# `conclusion == 'success'`. A GitHub Actions workflow concludes `success` only
# when every job passes, so a red in EITHER job blocks the GitHub release and the
# Fly rollout — the integration tier is now a deploy-path gate, not just a local
# pre-commit one (sty_ae474ca3).
#
# Policy (sty_ae474ca3): CI fails on ANY integration red. The local
# technical-debt-register is the LOCAL pre-commit tolerance only — CI does NOT
# consult it. A quarantined-but-red check still reds CI; the fix is to fix the
# test (the /loop), not to pad the register. The register is expected to stay
# empty in steady state.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: install graphviz
        # TestWorkflowDOT pipes the workflow DOT export through `dot` when the
        # binary exists — install it so the parse assertion runs in CI instead
        # of skipping (sty_60f1f5eb).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  integration:
    # Runs in parallel with vet-test (no `needs:`) so the fast unit path is not
    # serialized behind the slower tier. testcontainers uses the Docker daemon
    # present on the runner; chromedp uses the preinstalled Google Chrome
    # (chromedp.DefaultExecAllocatorOptions auto-discovers it, and the tests set
    # the no-sandbox flag). Tests needing GEMINI_API_KEY t.Skip when it is unset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: chrome version
        # Diagnostic: chromedp drives this binary; fail fast/visibly if it is
        # ever absent from the runner image.
        run: google-chrome --version
      - name: integration tier
        run: go test -tags integration -timeout 20m ./tests/integration/...
