name: test

# Unit tests only. Integration tests are gated by `//go:build
# integration` and require `-tags integration` plus the testcontainers
# Postgres machinery — they don't run here. release.yml and deploy.yml
# both gate on this workflow via `workflow_run`, so a red test job
# blocks both the GitHub release and the Fly rollout.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: install graphviz
        # TestWorkflowDOT pipes the workflow DOT export through `dot` when the
        # binary exists — install it so the parse assertion runs in CI instead
        # of skipping (sty_60f1f5eb).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
