name: test

# CI runs the fast, deterministic UNIT path only — `vet-test` (go vet + go
# test ./...). release.yml and deploy.yml gate on THIS workflow via
# `workflow_run` + `conclusion == 'success'`, so a unit/vet red blocks the
# GitHub release and the Fly rollout.
#
# The INTEGRATION tier (go test -tags integration — testcontainers Postgres +
# chromedp) is NOT run here. It is enforced LOCALLY by the
# `satellites-integration-review` reviewer, which runs the tier at the
# `integration` state of satellites-workflow, BEFORE the commit-push step — so a
# red tier blocks the ship on the operator's machine, before anything is pushed.
# Running it again in a GH runner would only duplicate that, cost runner minutes,
# and re-hit the chromedp/claude CI-incompatibilities the local gate skips with
# CI=1.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: install graphviz
        # TestWorkflowDOT pipes the workflow DOT export through `dot` when the
        # binary exists — install it so the parse assertion runs in CI instead
        # of skipping (sty_60f1f5eb).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
