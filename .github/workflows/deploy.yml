name: deploy

# After the upstream `test` workflow succeeds on main, build the
# satellites-server image and push it straight to registry.fly.io,
# then `flyctl deploy --image` to roll it out.
#
# The Go compile/vet gate moved out of this workflow — release.yml's
# matrix build covers every binary, and test.yml's vet+test gate this
# job via `workflow_run`. The Docker build below is the only image
# the Fly registry needs.
#
# This workflow skips GHCR as an intermediate registry — Fly is the
# only registry that matters for serving, and using a single registry
# removes a per-user GHCR ACL gotcha that 403'd the first attempt.
# Add GHCR back later if an immutable artifact history becomes useful.
#
# Required repo secret:
#   FLY_API_TOKEN — `fly tokens create deploy -a satellites-pprod`

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FLY_APP: satellites-pprod

jobs:
  # Deploy-path enforcement (sty_1ad84429, epic gated-deploy): refuse to roll
  # out code whose stories have not passed the done gate. For each sty_<id> in
  # the commit range this deploy ships, it reads the story's status — the
  # reviewer-only projection of a status_transition row, evidence an executor
  # cannot forge (spike sty_a49d425d). The `deploy` job `needs` this gate, so a
  # not-gated story blocks the rollout. `satellites story gate` is the chokepoint;
  # this job only feeds it the story refs from git.
  gate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # need history + tags to scope the deploy's commit range
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: build satellites CLI
        run: go build -o satellites ./cmd/satellites
      - name: gate deploy on story status
        env:
          # Injected read key (operator provisions: a non-admin api-key as a
          # repo secret). server_url comes from the committed .satellites/satellites.toml.
          SATELLITES_API_KEY: ${{ secrets.SATELLITES_API_KEY }}
        run: |
          set -euo pipefail

          # The commits this deploy ships since the last release tag. The
          # do-not-batch-stories principle keeps a push to one story, so this
          # range is normally one story's commits. release.yml may have already
          # tagged HEAD by the time this runs; step back past any HEAD tag so
          # the range is never empty for a fresh push.
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ] && [ "$(git rev-list -n1 "$LAST_TAG")" = "$(git rev-parse HEAD)" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 "${LAST_TAG}^" 2>/dev/null || true)
          fi
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; else RANGE="HEAD"; fi
          echo "deploy-gate: inspecting commit range ${RANGE}"

          # Story refs are linked to commits by the sty_<id> subject convention
          # — the only commit↔story thread today (spike §3, open question e).
          IDS=$(git log "$RANGE" --format='%s%n%b' | grep -oE 'sty_[0-9a-f]{8}' | sort -u || true)

          if [ -z "$IDS" ]; then
            # KNOWN GAP (epic-order:4, open question a): a commit with no sty_
            # ref is allowed in this first cut. Surfaced loudly, not silently.
            echo "::warning::deploy-gate: no sty_<id> refs in ${RANGE} — allowing (known gap, fed to epic-order:4)"
            exit 0
          fi

          echo "deploy-gate: stories referenced by this deploy:"
          echo "$IDS" | sed 's/^/  /'

          if [ -z "${SATELLITES_API_KEY:-}" ]; then
            # PROTOTYPE first cut (story 3 AC#2): without the injected read key
            # the gate cannot query the server, so enforcement is INERT. It
            # warns loudly rather than failing closed, so landing the gate does
            # not brick the pipeline before the operator provisions the secret.
            # epic-order:4 flips this on once SATELLITES_API_KEY exists.
            echo "::warning::deploy-gate: SATELLITES_API_KEY not provisioned — enforcement INERT (epic-order:3 prototype). The stories above were NOT verified."
            exit 0
          fi

          # shellcheck disable=SC2086
          ./satellites story gate $(echo "$IDS" | tr '\n' ' ')

  deploy:
    # Gate: only run when the upstream `test` workflow succeeded, OR
    # the operator triggered this workflow manually. workflow_run fires
    # on every completion (success + failure) so the conclusion check
    # is mandatory. Also `needs: gate` — a not-gated story refuses the
    # rollout (sty_1ad84429); if the gate job fails, this job is skipped.
    needs: gate
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-satellites-pprod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          # Pin to the SHA that triggered the upstream test run so the
          # image we build matches the commit that passed CI, not
          # whatever main looks like at job-start time.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: read .version
        id: meta
        env:
          # Under workflow_run, GITHUB_SHA points at the workflow_run
          # event's SHA (the default-branch HEAD when the upstream test
          # job started), which can drift past the commit we actually
          # checked out. Prefer head_sha; fall back to GITHUB_SHA for
          # workflow_dispatch invocations.
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="satellites-server.version:" {print $2}' .version)
          BUILD=$(awk   '$1=="satellites-server.build:"   {print $2}' .version)
          CLI_VERSION=$(awk '$1=="satellites.version:" {print $2}' .version)
          if [ -z "$VERSION" ] || [ -z "$BUILD" ] || [ -z "$CLI_VERSION" ]; then
            echo ".version missing satellites.version or satellites-server.{version,build}" >&2
            exit 1
          fi
          {
            echo "version=v${VERSION}"
            echo "cli_version=v${CLI_VERSION}"
            echo "build=${BUILD}"
            echo "commit=${BUILD_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"

      - name: auth to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: build + push image to Fly registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            registry.fly.io/satellites-pprod:latest
            registry.fly.io/satellites-pprod:${{ steps.meta.outputs.version }}
            registry.fly.io/satellites-pprod:${{ steps.meta.outputs.commit }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            CLI_VERSION=${{ steps.meta.outputs.cli_version }}
            BUILD=${{ steps.meta.outputs.build }}
            COMMIT=${{ steps.meta.outputs.commit }}
          provenance: false
          sbom: false

      - name: pre-deploy machine cleanup
        # Force-destroy machines stuck in `replacing` / `destroying`
        # before rolling out. Fly recreates them per
        # min_machines_running.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          stuck=$(flyctl machines list --app "$FLY_APP" --json \
            | jq '[.[] | select(.state == "replacing" or .state == "destroying")] | length')
          if [ "$stuck" -gt 0 ]; then
            echo "::warning::Found $stuck stuck machine(s) — forcing cleanup"
            flyctl machines list --app "$FLY_APP" --json \
              | jq -r '.[] | select(.state == "replacing" or .state == "destroying") | .id' \
              | xargs -I{} flyctl machines destroy {} --app "$FLY_APP" --force
            sleep 5
          fi

      - name: deploy
        uses: nick-fields/retry@v4
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            flyctl deploy \
              --app satellites-pprod \
              --image registry.fly.io/satellites-pprod:latest \
              --strategy immediate \
              --wait-timeout 300 \
              --yes
