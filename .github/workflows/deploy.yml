name: deploy

# After the upstream `test` workflow succeeds on main, build the
# satellites-server image and push it straight to registry.fly.io,
# then `flyctl deploy --image` to roll it out.
#
# The Go compile/vet gate moved out of this workflow — release.yml's
# matrix build covers every binary, and test.yml's vet+test gate this
# job via `workflow_run`. The Docker build below is the only image
# the Fly registry needs.
#
# This workflow skips GHCR as an intermediate registry — Fly is the
# only registry that matters for serving, and using a single registry
# removes a per-user GHCR ACL gotcha that 403'd the first attempt.
# Add GHCR back later if an immutable artifact history becomes useful.
#
# Required repo secret:
#   FLY_API_TOKEN — `fly tokens create deploy -a satellites-pprod`

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FLY_APP: satellites-pprod

jobs:
  deploy:
    # Gate: only run when the upstream `test` workflow succeeded, OR
    # the operator triggered this workflow manually. workflow_run fires
    # on every completion (success + failure) so the conclusion check
    # is mandatory.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-satellites-pprod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          # Pin to the SHA that triggered the upstream test run so the
          # image we build matches the commit that passed CI, not
          # whatever main looks like at job-start time.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: read .version
        id: meta
        env:
          # Under workflow_run, GITHUB_SHA points at the workflow_run
          # event's SHA (the default-branch HEAD when the upstream test
          # job started), which can drift past the commit we actually
          # checked out. Prefer head_sha; fall back to GITHUB_SHA for
          # workflow_dispatch invocations.
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="satellites-server.version:" {print $2}' .version)
          BUILD=$(awk   '$1=="satellites-server.build:"   {print $2}' .version)
          CLI_VERSION=$(awk '$1=="satellites.version:" {print $2}' .version)
          if [ -z "$VERSION" ] || [ -z "$BUILD" ] || [ -z "$CLI_VERSION" ]; then
            echo ".version missing satellites.version or satellites-server.{version,build}" >&2
            exit 1
          fi
          {
            echo "version=v${VERSION}"
            echo "cli_version=v${CLI_VERSION}"
            echo "build=${BUILD}"
            echo "commit=${BUILD_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"

      - name: auth to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: build + push image to Fly registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            registry.fly.io/satellites-pprod:latest
            registry.fly.io/satellites-pprod:${{ steps.meta.outputs.version }}
            registry.fly.io/satellites-pprod:${{ steps.meta.outputs.commit }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            CLI_VERSION=${{ steps.meta.outputs.cli_version }}
            BUILD=${{ steps.meta.outputs.build }}
            COMMIT=${{ steps.meta.outputs.commit }}
          provenance: false
          sbom: false

      - name: pre-deploy machine cleanup
        # Force-destroy machines stuck in `replacing` / `destroying`
        # before rolling out. Fly recreates them per
        # min_machines_running.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          stuck=$(flyctl machines list --app "$FLY_APP" --json \
            | jq '[.[] | select(.state == "replacing" or .state == "destroying")] | length')
          if [ "$stuck" -gt 0 ]; then
            echo "::warning::Found $stuck stuck machine(s) — forcing cleanup"
            flyctl machines list --app "$FLY_APP" --json \
              | jq -r '.[] | select(.state == "replacing" or .state == "destroying") | .id' \
              | xargs -I{} flyctl machines destroy {} --app "$FLY_APP" --force
            sleep 5
          fi

      - name: deploy
        uses: nick-fields/retry@v3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            flyctl deploy \
              --app satellites-pprod \
              --image registry.fly.io/satellites-pprod:latest \
              --strategy immediate \
              --wait-timeout 300 \
              --yes
