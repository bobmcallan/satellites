# scripts/docker-compose.dev.yml
#
# Local satellites-server stack for development.
#
# - postgres:        Postgres 16-alpine on :5432
# - satellites-server: built from scripts/Dockerfile.dev, runs in --dev
#                    mode (seeds admin + user with predictable api-keys
#                    sk_dev_admin and sk_dev_user), listens on :8080
#
# Bring up with scripts/dev-up.sh; tear down with scripts/dev-down.sh.

name: satellites-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: satellites-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: satellites
      POSTGRES_PASSWORD: satellites
      POSTGRES_DB: satellites
    ports:
      - "5432:5432"
    volumes:
      - satellites-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satellites -d satellites"]
      interval: 5s
      timeout: 5s
      retries: 5

  satellites-server:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.dev
    container_name: satellites-server-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://satellites:satellites@postgres:5432/satellites?sslmode=disable
      SATELLITES_LISTEN_ADDR: ":8080"
      SATELLITES_DEV: "true"
      SATELLITES_LOG_LEVEL: "info"
      SATELLITES_LOG_JSON: "false"
    ports:
      - "8080:8080"

volumes:
  satellites-postgres-data:
