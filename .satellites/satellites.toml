server_url = "https://satellites-pprod.fly.dev"
project_id = "proj_fc7d72d8"
repo_path = "."
worktree_root = "./.satellites/worktree"
log_path = "./.satellites/logs"
branch_template = "client-{task_id}-from-{base_sha}"

# global_publishers — the publishers (project ids) whose GLOBAL artifacts this
# repo CONSUMES from the shared library (epic:client-dir-separation order-4,
# retiring the per-skill library_pins). Opt into a publisher; `skill sync`
# materialises ALL its global governance (gates + capabilities) at lowest
# precedence (a same-named project/local skill wins). The product WORKFLOWS are
# repo-owned client-dir config under .satellites/workflows/ (order-2), NOT
# consumed from a publisher.
global_publishers = ["proj_682cfeed"]

# reviewer_model — model for reviewer claude -p runs (gate dispatcher + step
# summariser). Unset = inherit the harness default (sty_c7a5d741).
reviewer_model = "claude-opus-4-8"

# ungated_dirs — paths the START-door (satellites hook gate) will NOT gate.
# By default the door only gates edits INSIDE this repo; anything outside the
# repo root (e.g. ~/.claude — Claude's own config + memory) is already ungated.
# List extra dirs here to also ungate them (globs; a leading ~ expands to $HOME):
# ungated_dirs = ["~/.claude", "docs/scratch"]
